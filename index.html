<script>
'use strict';
const { Engine, World, Bodies, Body, Events, Runner } = Matter;

// ── Canvas ──────────────────────────────────────────────
const W = 400, H = 680;
const canvas = document.getElementById('c');
const DPR = window.devicePixelRatio || 1;
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';

// ── Layout constants ─────────────────────────────────────

const RX = W - WT;      // right wall inner x
const GW = RX - LX;     // game area width
const UI  = 105;        // UI panel height
const FLOOR_Y = H - WT; // floor y
const DLINE   = UI + 12;// drop y (preview center)
const DANGER  = UI + 22;// game-over danger line

// ── Animal definitions ────────────────────────────────────
const A = [
  { name:'ひよこ',      emoji:'🐥', r:20,  col:'#FFE040', pts:1  },
  { name:'ウサギ',      emoji:'🐰', r:28,  col:'#FFB6C1', pts:3  },
  { name:'ネコ',        emoji:'🐱', r:37,  col:'#FF9040', pts:6  },
  { name:'イヌ',        emoji:'🐶', r:47,  col:'#C89050', pts:10 },
  { name:'コアラ',      emoji:'🐨', r:58,  col:'#909090', pts:15 },
  { name:'パンダ',      emoji:'🐼', r:70,  col:'#E8E8E8', pts:21 },
  { name:'ライオン',    emoji:'🦁', r:83,  col:'#FFC020', pts:28 },
  { name:'ゾウ',        emoji:'🐘', r:97,  col:'#8080B0', pts:36 },
  { name:'きょうりゅう',emoji:'🦕', r:112, col:'#50C050', pts:45 },
  { name:'ドラゴン',    emoji:'🐉', r:128, col:'#FF4060', pts:55 },
];

// ── Physics engine ────────────────────────────────────────
const engine = Engine.create({
  gravity: { y: 1.2 },
  positionIterations: 10,  // 衝突解決の精度を上げる

const world = engine.world;

// 床は200px厚にしてトンネリングを防ぐ（見た目の床ラインはFLOOR_Yで別途描画）

  Bodies.rectangle(LX/2,   H/2,           WT,    H*2,   { isStatic:true, label:'wall' }),
  Bodies.rectangle(W-WT/2, H/2,           WT,    H*2,   { isStatic:true, label:'wall' }),
  Bodies.rectangle(W/2,    -WT/2,         W + 4, WT,    { isStatic:true, label:'ceil' }),

// ── Game state ────────────────────────────────────────────
let score = 0;
let hi    = +localStorage.getItem('doub_hi') || 0;
let over  = false;
let started   = false;
let paused    = false;
let dropping  = false;
let touching  = false;
let mx    = W / 2;
let cur   = rnd3(), nxt = rnd3();
let parts = [];
let overTimer = 0;
let flashList = [];
let showEvolution = false;
let autoSubmitMsg = '';

function rnd3() { return Math.floor(Math.random() * 3); }

// ── Audio System ───────────────────────────────────────────
class Sound {
  constructor() {
    this.ac      = null;
    this.comp    = null;
    this.muted   = false;
    this.bgmOn   = false;
    this.bgmTid  = null;
    this.comboN  = 0;
    this.comboTid = null;
    this.achieved = new Set();
  }

  boot() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    this.ac   = new (window.AudioContext || window.webkitAudioContext)();
    this.comp = this.ac.createDynamicsCompressor();
    this.comp.threshold.value = -18;
    this.comp.ratio.value     = 4;
    this.comp.connect(this.ac.destination);
    this.bgmOn = true;
    this._bgm();
  }

  // ── primitive ───────────────────────────────────────────
  _note(freq, start, dur, type, vol, atk = 0.005) {
    if (!this.ac || this.muted) return;
    try {
      const osc = this.ac.createOscillator();
      const env = this.ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      env.gain.setValueAtTime(0,   start);
      env.gain.linearRampToValueAtTime(vol, start + atk);
      env.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(env); env.connect(this.comp);
      osc.start(start); osc.stop(start + dur + 0.02);
    } catch(e) {}
  }

  // ── sound events ────────────────────────────────────────
  drop() {
    if (!this.ac || this.muted) return;
    const t = this.ac.currentTime;
    this._note(200, t,       0.13, 'sine',     0.22, 0.003);
    this._note(140, t + 0.02,0.09, 'triangle', 0.10, 0.003);
  }

  merge(level) {
    if (!this.ac || this.muted) return;
    if (level >= A.length - 1) { this._dragon(); return; }

    // combo tracking
    this.comboN++;
    clearTimeout(this.comboTid);
    this.comboTid = setTimeout(() => { this.comboN = 0; }, 950);

    // C major scale mapped per level
    const scale = [262, 294, 330, 370, 392, 440, 494, 523, 587, 659];
    const f   = scale[level];
    const t   = this.ac.currentTime;
    const vol = Math.min(0.55, 0.28 + level * 0.028 + Math.min(this.comboN, 4) * 0.04);
    const dur = 0.18 + level * 0.016;

    // root + fifth + octave chord (juicy!)
    this._note(f,       t,        dur,       'sine',     vol,       0.004);
    this._note(f * 1.5, t,        dur * 0.7, 'sine',     vol * 0.38,0.004);
    this._note(f * 2,   t + 0.02, dur * 0.5, 'triangle', vol * 0.22,0.003);
    if (level >= 4) this._note(f * 1.25, t, dur * 0.55, 'sine', vol * 0.18, 0.005);
    if (level >= 7) this._note(f * 3,    t + 0.03, dur * 0.35, 'sine', vol * 0.12, 0.003);

    // ── combo arpeggio ────────────────────────────────────
    if (this.comboN >= 2) {
      const steps = [1.25, 1.5, 1.75, 2, 2.5].slice(0, this.comboN - 1);
      steps.forEach((r, i) => setTimeout(() => {
        if (!this.ac || this.muted) return;
        this._note(f * r, this.ac.currentTime, 0.09, 'sine', 0.18, 0.003);
      }, 75 + i * 65));
    }

    // ── first-time achievement jingle ────────────────────
    if (level >= 3 && !this.achieved.has(level)) {
      this.achieved.add(level);
      [1, 1.25, 1.5, 2].forEach((r, i) => setTimeout(() => {
        if (!this.ac || this.muted) return;
        const ct = this.ac.currentTime;
        this._note(f * r,     ct, 0.14, 'sine',     0.25, 0.004);
        this._note(f * r * 2, ct, 0.09, 'triangle', 0.10, 0.003);
      }, 160 + i * 80));
    }
  }

  _dragon() {
    if (!this.ac || this.muted) return;
    // Rising fanfare: C E G C' E' G' C''
    [[523,0],[659,0.1],[784,0.2],[1047,0.35],[1319,0.52],[1568,0.7],[2093,0.92]]
      .forEach(([f, d]) => setTimeout(() => {
        if (!this.ac || this.muted) return;
        const t = this.ac.currentTime;
        this._note(f,       t, 0.22, 'sine',     0.45, 0.005);
        this._note(f * 1.5, t, 0.16, 'triangle', 0.18, 0.005);
      }, d * 1000));
  }

  gameOver() {
    if (!this.ac) return;
    this.bgmOn = false; clearTimeout(this.bgmTid);
    // Sad descending melody
    [[523,0],[466,0.22],[415,0.46],[370,0.72],[330,1.02],[262,1.38]]
      .forEach(([f, d]) => setTimeout(() => {
        if (!this.ac) return;
        const t = this.ac.currentTime;
        this._note(f,       t, 0.38, 'sawtooth', 0.18, 0.012);
        this._note(f * 0.5, t, 0.38, 'sine',     0.12, 0.012);
      }, d * 1000));
  }

  restart() {
    this.comboN = 0; this.achieved.clear();
    this.bgmOn = true; this._bgm();
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) { this.bgmOn = false; clearTimeout(this.bgmTid); }
    else            { this.bgmOn = true;  this._bgm(); }
    return this.muted;
  }

  pause() {
    if (this.ac) this.ac.suspend();
    this.bgmOn = false; clearTimeout(this.bgmTid);
  }

  resume() {
    if (this.ac) this.ac.resume();
    if (!this.muted) { this.bgmOn = true; this._bgm(); }
  }

  // ── BGM: catchy chiptune ─────────────────────────────────
  // ── ノイズバッファ（ドラム用キャッシュ） ────────────────
  _nbuf() {
    if (this._noiseCache) return this._noiseCache;
    const len = this.ac.sampleRate;
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._noiseCache = buf;
    return buf;
  }

  // ── キック ────────────────────────────────────────────────
  _kick(t) {
    if (!this.ac || this.muted) return;
    const osc = this.ac.createOscillator();
    const env = this.ac.createGain();
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(36, t + 0.09);
    env.gain.setValueAtTime(1.4, t);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.30);
    osc.connect(env); env.connect(this.comp);
    osc.start(t); osc.stop(t + 0.32);
  }

  // ── スネア ────────────────────────────────────────────────
  _snare(t) {
    if (!this.ac || this.muted) return;
    const src = this.ac.createBufferSource();
    src.buffer = this._nbuf();
    const bpf = this.ac.createBiquadFilter();
    bpf.type = 'bandpass'; bpf.frequency.value = 1800; bpf.Q.value = 0.8;
    const env = this.ac.createGain();
    env.gain.setValueAtTime(0.7, t);
    env.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    src.connect(bpf); bpf.connect(env); env.connect(this.comp);
    src.start(t); src.stop(t + 0.15);
    // 胴鳴り
    this._note(200, t, 0.06, 'triangle', 0.22, 0.001);
  }

  // ── ハイハット ────────────────────────────────────────────
  _hat(t, vol = 0.18, dur = 0.035) {
    if (!this.ac || this.muted) return;
    const src = this.ac.createBufferSource();
    src.buffer = this._nbuf();
    const hpf = this.ac.createBiquadFilter();
    hpf.type = 'highpass'; hpf.frequency.value = 7500;
    const env = this.ac.createGain();
    env.gain.setValueAtTime(vol, t);
    env.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(hpf); hpf.connect(env); env.connect(this.comp);
    src.start(t); src.stop(t + dur + 0.01);
  }

  // ── BGM: ダーク・エレクトロニック（Aマイナー, 126BPM） ──
  _bgm() {
    if (!this.bgmOn || !this.ac || this.muted) return;
    const BPM  = 126;
    const b    = 60 / BPM;        // 1拍
    const e    = b / 2;           // 8分
    const s    = b / 4;           // 16分
    const BARS = 4;
    const now  = this.ac.currentTime + 0.04;

    // ── ドラム（4つ打ち + バックビートスネア） ─────────────
    for (let bar = 0; bar < BARS; bar++) {
      for (let beat = 0; beat < 4; beat++) {
        const t = now + (bar * 4 + beat) * b;
        this._kick(t);
        if (beat === 1 || beat === 3) this._snare(t);
        // クローズドハイハット（8分）
        this._hat(t,     0.16, 0.03);
        this._hat(t + e, 0.11, 0.025);
        // オープンハイハット（スネア直前）
        if (beat === 0 || beat === 2)
          this._hat(t + e + s, 0.20, 0.10);
      }
    }

    // ── シンセベース（Aマイナー下降） ──────────────────────
    // Am: A2=110, G2=98, E2=82.4, C3=130.8
    // F:  F2=87.3, A2=110, C3=130.8
    // E:  E2=82.4, B2=123.5, G#2=103.8
    const bassLines = [
      // bar0 Am: 8分×8
      [110,110, 98, 110, 110, 82.4, 98, 110],
      // bar1 Am variation
      [110,130.8, 110, 98, 82.4, 98, 110, 130.8],
      // bar2 F
      [87.3,87.3, 110, 87.3, 87.3, 110, 130.8, 110],
      // bar3 E
      [82.4,82.4, 103.8, 123.5, 82.4, 82.4, 103.8, 82.4],
    ];
    bassLines.forEach((line, bar) => {
      line.forEach((freq, i) => {
        const t = now + (bar * 4 + i * 0.5) * b;
        this._note(freq, t, e * 0.85, 'sawtooth', 0.18, 0.008);
      });
    });

    // ── シンセアルペジオ（16分音符、電子的） ───────────────
    const arpSeqs = [
      // bar0 Am 上昇→下降
      [440,523,659,784, 880,784,659,523, 440,523,659,784, 880,784,659,523],
      // bar1 Am 高域バリエーション
      [523,659,784,880, 784,659,523,440, 392,440,523,659, 784,659,523,440],
      // bar2 F
      [349,440,523,698, 784,698,523,440, 349,440,523,698, 784,698,523,440],
      // bar3 E → Am解決
      [330,415,494,659, 659,494,415,330, 330,415,494,659, 698,659,523,440],
    ];
    arpSeqs.forEach((seq, bar) => {
      seq.forEach((freq, i) => {
        const t = now + (bar * 4 + i * 0.25) * b;
        this._note(freq, t, s * 0.78, 'square', 0.048, 0.003);
      });
    });

    // ── サブリード（1拍ごとのシンセ）────────────────────────
    const lead = [
      // bar0 Am
      [440,0],[523,1],[659,2],[523,3],
      // bar1
      [440,4],[392,5],[440,6],[523,7],
      // bar2 F
      [349,8],[440,9],[523,10],[440,11],
      // bar3 E
      [330,12],[415,13],[494,14],[440,15],
    ];
    lead.forEach(([freq, beat]) => {
      const t = now + beat * b;
      this._note(freq,       t, b * 0.7,  'triangle', 0.07, 0.01);
      this._note(freq * 2,   t, b * 0.5,  'sine',     0.03, 0.01);
    });

    // ── パッド（コード、薄く持続） ────────────────────────────
    [
      [[220, 261.6, 329.6, 392], 0, 2],  // Am7
      [[174.6, 220, 261.6, 329.6], 2, 1], // Fmaj
      [[164.8, 207.7, 246.9, 329.6], 3, 1], // Em
    ].forEach(([notes, bar, dur]) => {
      const t = now + bar * 4 * b;
      notes.forEach(f => this._note(f, t, dur * 4 * b * 0.92, 'sine', 0.032, 0.06));
    });

    this.bgmTid = setTimeout(() => this._bgm(), BARS * 4 * b * 1000);
  }
}
const snd = new Sound();

// ── Supabase ──────────────────────────────────────────────
const sb = supabase.createClient(
  'https://mfazjpmpegbnkrxqlsha.supabase.co',
  'sb_publishable_PHhwTlbnxLI9-WAffqbmaQ_nboWZU5s'
);
let leaderboard       = [];
let showRanking       = false;
let showRankingOverlay = false;

async function fetchRanking() {
  const { data } = await sb.from('scores')
    .select('name, score')
    .order('score', { ascending: false })
    .limit(10);
  if (data) leaderboard = data;
}

async function toggleRankingOverlay() {
  if (showRankingOverlay) { showRankingOverlay = false; return; }
  showRankingOverlay = true;
  if (leaderboard.length === 0) await fetchRanking();
}

async function submitScore(name, scoreVal) {
  const nm = name.trim();
  const { data: existing } = await sb.from('scores')
    .select('score').eq('name', nm).maybeSingle();
  const { error } = await sb.rpc('upsert_score', { p_name: nm, p_score: scoreVal });
  if (error) return { ok: false };
  const isNewRecord = !existing || scoreVal > existing.score;
  return { ok: true, isNewRecord, prevScore: existing?.score };
}

// ── 名前入力UI ────────────────────────────────────────────
const nameOverlay = document.getElementById('nameOverlay');
const nameInput   = document.getElementById('nameInput');
const nameStatus  = document.getElementById('nameStatus');

function showNameOverlay() {
  document.getElementById('nameScoreDisp').textContent =
    `スコア: ${score.toLocaleString()}`;
  nameInput.value = localStorage.getItem('doub_name') || '';
  nameStatus.textContent = '';
  nameOverlay.classList.add('show');
  setTimeout(() => nameInput.focus(), 100);
}
function hideNameOverlay() {
  nameOverlay.classList.remove('show');
}

document.getElementById('nameSubmit').addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name) { nameStatus.textContent = 'なまえを入れてください！'; return; }
  nameStatus.textContent = '送信中…';
  document.getElementById('nameSubmit').disabled = true;
  const result = await submitScore(name, score);
  if (!result.ok) {
    nameStatus.textContent = '送信に失敗しました。もう一度お試しください。';
    document.getElementById('nameSubmit').disabled = false;
    return;
  }
  localStorage.setItem('doub_name', name);
  autoSubmitMsg = result.isNewRecord ? '🎉 新記録更新！' : `最高: ${(result.prevScore || score).toLocaleString()}点`;
  hideNameOverlay();
  await fetchRanking();
  showRanking = true;
  document.getElementById('nameSubmit').disabled = false;
});

document.getElementById('nameSkip').addEventListener('click', async () => {
  hideNameOverlay();
  await fetchRanking();
  showRanking = true;
});

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('nameSubmit').click();
});

// ── Body creation ─────────────────────────────────────────
function mkAnimal(x, y, type) {
  const b = Bodies.circle(x, y, A[type].r, {
    restitution: 0.22,
    friction:    0.65,
    frictionAir: 0.025,
    density:     0.003,
    label: 'animal',
  });
  b.atype  = type;
  b.merged = false;
  World.add(world, b);
  return b;
}

// ── Merge collision ───────────────────────────────────────
Events.on(engine, 'collisionStart', e => {
  if (over) return;
  for (const { bodyA: a, bodyB: b } of e.pairs) {
    if (a.label !== 'animal' || b.label !== 'animal') continue;
    if (a.atype !== b.atype) continue;
    if (a.atype >= A.length - 1) continue;
    if (a.merged || b.merged) continue;
    a.merged = b.merged = true;

    const nt = a.atype + 1;
    const mx2 = (a.position.x + b.position.x) / 2;
    const my2 = (a.position.y + b.position.y) / 2;

    setTimeout(() => {
      if (!world.bodies.includes(a) || !world.bodies.includes(b)) return;
      World.remove(world, a);
      World.remove(world, b);
      const nb = mkAnimal(mx2, my2, nt);
      Body.setVelocity(nb, { x: 0, y: -4 });
      burst(mx2, my2, A[nt].col, nt >= 7 ? 24 : 14);
      score += A[nt].pts;
      if (score > hi) { hi = score; localStorage.setItem('doub_hi', hi); }
      flashList.push({ x: mx2, y: my2 - A[nt].r - 10, txt: `+${A[nt].pts}`, life: 1.2, col: A[nt].col });
      snd.merge(nt);
    }, 30);
  }
});

// ── Particles ─────────────────────────────────────────────
function burst(x, y, col, n = 14) {
  for (let i = 0; i < n; i++) {
    const angle = Math.PI * 2 * i / n + Math.random() * 0.3;
    const spd   = 3 + Math.random() * 6;
    parts.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 2,
      life: 1,
      col,
      sz: 4 + Math.random() * 6,
    });
  }
  // Star sparkle for big merges
  if (n >= 20) {
    for (let i = 0; i < 8; i++) {
      const a = Math.PI * 2 * i / 8;
      parts.push({ x, y, vx: Math.cos(a)*10, vy: Math.sin(a)*10 - 3, life:0.8, col:'#FFD700', sz:8, star:true });
    }
  }
}

// ── Input ─────────────────────────────────────────────────
function clampX() {
  const r = A[cur].r;
  return Math.max(LX + r + 2, Math.min(RX - r - 2, mx));
}
function toCanvas(clientX, clientY) {
  const rc = canvas.getBoundingClientRect();
  return [(clientX - rc.left) * (W / rc.width), (clientY - rc.top) * (H / rc.height)];
}

// ── マウス（デスクトップ）──
canvas.addEventListener('mousemove', e => {
  mx = toCanvas(e.clientX, e.clientY)[0];
});
canvas.addEventListener('click', e => {
  snd.boot();
  const [cx, cy] = toCanvas(e.clientX, e.clientY);
  if (!started) { started = true; return; }
  if (over)         { handleOverClick(cx, cy); return; }
  if (showEvolution){ showEvolution = false; return; }
  if (showRankingOverlay && !(cx > 94 && cx < 144 && cy > 72 && cy < 100)) { showRankingOverlay = false; return; }
  if (handleUIClick(cx, cy)) return;
  if (!dropping) drop();
});

// ── タッチ（スマホ）スイカゲーム方式 ──
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  snd.boot();
  const t = e.touches[0];
  const [cx, cy] = toCanvas(t.clientX, t.clientY);
  if (!started) { started = true; return; }
  if (over)          { handleOverClick(cx, cy); return; }
  if (showEvolution) { showEvolution = false; return; }
  if (showRankingOverlay && !(cx > 94 && cx < 144 && cy > 72 && cy < 100)) { showRankingOverlay = false; return; }
  if (handleUIClick(cx, cy)) return;
  touching = true;
  mx = cx;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touching) return;
  mx = toCanvas(e.touches[0].clientX, e.touches[0].clientY)[0];
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touching) return;
  touching = false;
  if (!dropping && !paused) drop();
}, { passive: false });

canvas.addEventListener('touchcancel', e => { touching = false; }, { passive: false });

function handleOverClick(cx, cy) {
  if (showRanking) {
    if (cx > W/2-90 && cx < W/2+90 && cy > H-70 && cy < H-22) { restart(); return; }
    if (cx > W/2-65 && cx < W/2+65 && cy > H-102 && cy < H-76) {
      localStorage.removeItem('doub_name');
      showRanking = false;
      showNameOverlay();
    }
  } else {
    if (cx > W/2-90 && cx < W/2+90 && cy > H/2+65 && cy < H/2+115) restart();
  }
}
function handleUIClick(cx, cy) {
  if (cx > 10  && cx < 46  && cy > 74 && cy < 98) { snd.toggleMute(); return true; }
  if (cx > 52  && cx < 88  && cy > 74 && cy < 98) { togglePause(); return true; }
  if (cx > 148 && cx < 188 && cy > 72 && cy < 100) { showEvolution = !showEvolution; showRankingOverlay = false; return true; }
  if (cx > 94  && cx < 144 && cy > 72 && cy < 100) { toggleRankingOverlay(); return true; }
  // ポーズ中は画面タップで再開
  if (paused) { togglePause(); return true; }
  return false;
}

function drop() {
  mkAnimal(clampX(), DLINE - 4, cur);
  snd.drop();
  cur = nxt; nxt = rnd3();
  dropping = true;
  setTimeout(() => { dropping = false; }, 520);
}

function restart() {
  [...world.bodies].filter(b => b.label === 'animal').forEach(b => World.remove(world, b));
  parts = []; flashList = [];
  score = 0; over = false; dropping = false; overTimer = 0;
  showRanking = false; showRankingOverlay = false; leaderboard = []; autoSubmitMsg = '';
  hideNameOverlay();
  cur = rnd3(); nxt = rnd3();
  if (paused) { paused = false; Runner.run(runner, engine); }
  snd.restart();
}

// ── Game-over detection ───────────────────────────────────
function checkOver(dt) {
  const danger = world.bodies.filter(b =>
    b.label === 'animal' &&
    b.position.y - b.circleRadius < DANGER &&
    Math.abs(b.velocity.y) < 1.0 &&
    Math.abs(b.velocity.x) < 1.0
  );
  if (danger.length > 0) {
    overTimer += dt;
    if (overTimer > 2000) {
      over = true; snd.gameOver();
      setTimeout(async () => {
        const savedName = localStorage.getItem('doub_name');
        if (savedName) {
          const result = await submitScore(savedName, score);
          autoSubmitMsg = result.isNewRecord ? '🎉 新記録更新！' : `最高: ${(result.prevScore || score).toLocaleString()}点`;
          await fetchRanking();
          showRanking = true;
        } else {
          showNameOverlay();
        }
      }, 1200);
    }
  } else {
    overTimer = Math.max(0, overTimer - dt * 2);
  }
}

// ── Color helpers ─────────────────────────────────────────
function tint(hex, n) {
  const r = clamp8(parseInt(hex.slice(1,3),16) + n);
  const g = clamp8(parseInt(hex.slice(3,5),16) + n);
  const b = clamp8(parseInt(hex.slice(5,7),16) + n);
  return `rgb(${r},${g},${b})`;
}
function clamp8(v) { return Math.max(0, Math.min(255, v)); }
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Rounded rect ──────────────────────────────────────────
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ── Draw animal body ──────────────────────────────────────
function drawAnimal(x, y, r, type, alpha = 1) {
  const an = A[type];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  // Shadow
  ctx.beginPath(); ctx.arc(3, 3, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();

  // Gradient circle
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  const g = ctx.createRadialGradient(-r*.3, -r*.35, r*.05, 0, 0, r);
  g.addColorStop(0, tint(an.col,  60));
  g.addColorStop(1, tint(an.col, -10));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = tint(an.col, -30);
  ctx.lineWidth = 2.5; ctx.stroke();

  // Emoji
  const fs = Math.min(r * 1.25, 95);
  ctx.font = `${fs}px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillText(an.emoji, 0, 2);

  ctx.restore();
}

// ── Main render ───────────────────────────────────────────
function draw() {
  // ── Background ──
  const bg = ctx.createLinearGradient(0, UI, 0, H);
  bg.addColorStop(0, '#fff0ff');
  bg.addColorStop(1, '#ffe0f5');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // ── Walls ──
  ctx.fillStyle = '#b080d8';
  ctx.fillRect(0,    UI, WT, H-UI);
  ctx.fillRect(RX,   UI, WT, H-UI);
  ctx.fillRect(0, FLOOR_Y, W, WT);

  // Wall shine
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(2, UI, 4, H-UI);
  ctx.fillRect(RX+2, UI, 4, H-UI);

  // ── Game area bg ──
  ctx.fillStyle = 'rgba(255,248,255,0.75)';
  ctx.fillRect(LX, UI, GW, FLOOR_Y - UI);

  // ── Danger line ──
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 80, 80, 0.35)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.moveTo(LX, DANGER); ctx.lineTo(RX, DANGER); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // ── Drop guide ──
  if (!over && !showEvolution && started) {
    const dx = clampX();
    const r  = A[cur].r;
    const holdAlpha = touching ? 0.95 : 0.75;
    // Vertical guide
    ctx.save();
    ctx.strokeStyle = touching ? 'rgba(255,180,80,0.5)' : 'rgba(150,80,220,0.2)';
    ctx.lineWidth = touching ? 2 : 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(dx, DLINE + r + 2); ctx.lineTo(dx, FLOOR_Y - 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Preview animal（押している間は大きく・明るく）
    if (!dropping) {
      const scale = touching ? 1.08 : 1;
      ctx.save();
      ctx.translate(dx, DLINE);
      ctx.scale(scale, scale);
      ctx.translate(-dx, -DLINE);
      drawAnimal(dx, DLINE, r, cur, holdAlpha);
      ctx.restore();
    }

    // スマホ向けヒント（最初の数秒）
    if (touching) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,200,80,0.85)';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('はなすと落とす！', dx, DLINE - r - 18);
      ctx.restore();
    }
  }

  // ── Physics animals ──
  for (const b of world.bodies) {
    if (b.label !== 'animal' || b.isStatic) continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    drawAnimal(0, 0, b.circleRadius, b.atype);
    ctx.restore();
  }

  // ── Particles ──
  for (const p of parts) {
    const a = Math.max(0, p.life);
    ctx.beginPath();
    if (p.star) {
      ctx.save();
      ctx.translate(p.x, p.y);
      drawStar(0, 0, p.sz * a * 0.6, p.sz * a * 1.4, 5);
      ctx.fillStyle = hexAlpha(p.col, a);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.arc(p.x, p.y, Math.max(0.1, p.sz * a), 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(p.col, a);
      ctx.fill();
    }
  }

  // ── Score floaters ──
  for (const f of flashList) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = f.col;
    ctx.shadowBlur = 8;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }

  // ── UI Panel ──
  const uig = ctx.createLinearGradient(0, 0, 0, UI);
  uig.addColorStop(0, '#6020c0');
  uig.addColorStop(1, '#8040d8');
  ctx.fillStyle = uig; ctx.fillRect(0, 0, W, UI);

  // Top border glow
  ctx.fillStyle = 'rgba(200,150,255,0.5)'; ctx.fillRect(0, UI - 3, W, 3);

  // Score box
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  rrect(10, 10, 115, 80, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('スコア', 67, 33);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText(score.toLocaleString(), 67, 72);

  // Hi score box
  ctx.fillStyle = 'rgba(255,220,0,0.15)';
  rrect(W-125, 10, 115, 80, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,100,0.8)';
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('さいこうきろく', W-67, 30);
  ctx.fillStyle = '#ffe090';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText(hi.toLocaleString(), W-67, 72);

  // Next box
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  rrect(W/2-38, 8, 76, 84, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('つぎ', W/2, 28);
  ctx.font = "40px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  ctx.fillStyle = '#000'; ctx.textBaseline = 'middle';
  ctx.fillText(A[nxt].emoji, W/2, 68);

  // Mute button
  ctx.fillStyle = snd.muted ? 'rgba(255,80,80,0.4)' : 'rgba(255,255,255,0.18)';
  rrect(10, 74, 36, 24, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = "16px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(snd.muted ? '🔇' : '🔊', 28, 86);

  // Pause button
  ctx.fillStyle = paused ? 'rgba(255,200,50,0.45)' : 'rgba(255,255,255,0.18)';
  rrect(52, 74, 36, 24, 7); ctx.fill();
  ctx.fillStyle = paused ? '#ffe066' : 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(paused ? '▶' : '⏸', 70, 86);

  // Ranking button
  ctx.fillStyle = showRankingOverlay ? 'rgba(255,220,50,0.35)' : 'rgba(255,255,255,0.18)';
  rrect(96, 74, 46, 24, 7); ctx.fill();
  ctx.fillStyle = showRankingOverlay ? '#ffe090' : 'rgba(255,255,255,0.7)';
  ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('ランク', 119, 86);

  // Evolution hint button
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  rrect(148, 74, 38, 24, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('図鑑', 167, 86);

  // ── Evolution chart overlay ──
  if (showEvolution) {
    ctx.fillStyle = 'rgba(20, 10, 50, 0.92)';
    rrect(20, 20, W-40, H-40, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(180,100,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('しんかひょう', W/2, 60);
    ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('タップでとじる', W/2, 80);
    const cols = 2;
    A.forEach((an, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = 60 + col * 175;
      const y = 110 + row * 57;
      // circle bg
      ctx.beginPath(); ctx.arc(x, y + 18, 22, 0, Math.PI*2);
      ctx.fillStyle = hexAlpha(an.col, 0.3); ctx.fill();
      ctx.strokeStyle = an.col; ctx.lineWidth = 2; ctx.stroke();
      ctx.font = "26px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(an.emoji, x, y + 19);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(an.name, x + 50, y + 15);
      ctx.fillStyle = '#ffe090'; ctx.font = '12px sans-serif';
      ctx.fillText(`${an.pts}pt`, x + 50, y + 33);
      if (i < A.length - 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '16px sans-serif';
        ctx.textBaseline = 'middle';
        if (col === 0) ctx.fillText('→', x + 100, y + 18);
        else { ctx.fillText('↓', 35, y + 50); }
      }
    });
    return;
  }

  // ── ランキングオーバーレイ（いつでも表示可） ──
  if (showRankingOverlay) {
    ctx.fillStyle = 'rgba(20, 10, 50, 0.93)';
    rrect(16, 46, W-32, H-60, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(180,100,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.fillStyle = '#ffe090';
    ctx.font = 'bold 21px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏆 ランキング TOP10', W/2, 80);

    const medals = ['🥇','🥈','🥉'];
    if (leaderboard.length === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '15px sans-serif';
      ctx.fillText('データ取得中…', W/2, H/2);
    } else {
      leaderboard.forEach((entry, i) => {
        const y = 116 + i * 48;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = i < 3 ? "20px 'Apple Color Emoji','Segoe UI Emoji',sans-serif" : 'bold 15px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(i < 3 ? medals[i] : `${i+1}.`, LX + 14, y);
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(entry.name, LX + 50, y);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffe090';
        ctx.fillText(entry.score.toLocaleString(), RX - 10, y);
      });
    }

    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('タップでとじる', W/2, H - 26);
    return;
  }

  // ── Game over overlay ──
  if (over) {
    // ── ポーズ中オーバーレイ ──
    if (paused) {
      ctx.fillStyle = 'rgba(10, 5, 30, 0.72)';
      ctx.fillRect(0, UI, W, H - UI);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // 大きな⏸アイコン
      ctx.font = "80px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('⏸', W/2, H/2 - 40);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('一時停止中', W/2, H/2 + 30);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '16px sans-serif';
      ctx.fillText('タップして再開', W/2, H/2 + 68);
      return;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, W, H);

    if (showRanking) {
      // ── ランキング画面 ──
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      // タイトル
      ctx.fillStyle = '#ffe090';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('🏆 ランキング TOP10', W/2, 55);

      // 名前 & 結果メッセージ
      const myName = localStorage.getItem('doub_name') || '';
      ctx.font = '14px sans-serif';
      ctx.fillStyle = autoSubmitMsg.startsWith('🎉') ? '#ffe090' : 'rgba(255,255,255,0.65)';
      ctx.fillText(myName ? `${myName}  ${autoSubmitMsg}` : autoSubmitMsg, W/2, 80);

      // 今回のスコア
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '14px sans-serif';
      ctx.fillText(`今回: ${score.toLocaleString()}点`, W/2, 98);

      // ランキングリスト
      const medals = ['🥇','🥈','🥉'];
      leaderboard.forEach((entry, i) => {
        const y = 126 + i * 46;
        const isMe = myName && entry.name === myName;

        // 行背景
        if (isMe) {
          ctx.fillStyle = 'rgba(255,200,50,0.18)';
          rrect(LX + 4, y - 18, GW - 8, 36, 8); ctx.fill();
        }

        // 順位
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.font = i < 3 ? "22px 'Apple Color Emoji','Segoe UI Emoji',sans-serif" : 'bold 16px sans-serif';
        ctx.fillStyle = i < 3 ? '#fff' : 'rgba(255,255,255,0.7)';
        ctx.fillText(i < 3 ? medals[i] : `${i+1}.`, LX + 14, y);

        // 名前
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = isMe ? '#ffe090' : '#fff';
        ctx.fillText(entry.name, LX + 52, y);

        // スコア
        ctx.textAlign = 'right';
        ctx.fillStyle = isMe ? '#ffe090' : 'rgba(255,255,255,0.85)';
        ctx.fillText(entry.score.toLocaleString(), RX - 10, y);
      });

      if (leaderboard.length === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('データ取得中…', W/2, H/2);
      }

      // なまえ変更ボタン
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      rrect(W/2-65, H-102, 130, 26, 13); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✏️ なまえを変える', W/2, H-89);

      // リスタートボタン
      const bx2 = W/2 - 90, by2 = H - 70;
      const rbg2 = ctx.createLinearGradient(bx2, 0, bx2+180, 0);
      rbg2.addColorStop(0, '#ff6b9d'); rbg2.addColorStop(1, '#ff9b6b');
      ctx.fillStyle = rbg2;
      rrect(bx2, by2, 180, 48, 24); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 19px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('もう一度あそぶ！', W/2, by2 + 24);

    } else {
      // ── 通常ゲームオーバー画面 ──
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ゲームオーバー！', W/2, H/2 - 90);

      ctx.font = "56px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
      ctx.fillText('😢', W/2, H/2 - 30);

      ctx.fillStyle = '#ffe090';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText(`スコア: ${score.toLocaleString()}`, W/2, H/2 + 35);
      ctx.fillStyle = '#aaa';
      ctx.font = '20px sans-serif';
      ctx.fillText(`さいこうきろく: ${hi.toLocaleString()}`, W/2, H/2 + 70);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '14px sans-serif';
      ctx.fillText('名前入力画面が出ます…', W/2, H/2 + 108);

      if (score > 0) {
        const maxPts = A.reduce((s,a) => s+a.pts, 0) * 3;
        const stars = score >= maxPts * 0.7 ? 3 : score >= maxPts * 0.35 ? 2 : 1;
        ctx.font = '36px sans-serif';
        ctx.fillText('⭐'.repeat(stars), W/2, H/2 - 145);
      }
    }
    return;
  }

  // ── スタート画面 ──
  if (!started) {
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // transformをリセットしてDPRだけ適用

    ctx.fillStyle = 'rgba(20,10,50,0.88)';
    ctx.fillRect(0, 0, W, H);

    // タイトル
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('どうぶつドロップ', W / 2, 155);

    // どうぶつ絵文字（フォント明示）
    ctx.font = "44px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    ctx.fillStyle = '#000';
    ctx.fillText('🐥🐰🐱🐶🐨', W / 2, 225);

    // タップボタン
    const bx = W / 2 - 115;
    const by = 278;
    const sbg = ctx.createLinearGradient(bx, 0, bx + 230, 0);
    sbg.addColorStop(0, '#a855f7'); sbg.addColorStop(1, '#ec4899');
    ctx.fillStyle = sbg;
    rrect(bx, by, 230, 58, 29); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 21px sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('タップしてスタート！', W / 2, by + 29);

    // 操作説明（絵文字なし・短く）
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.font = '13px sans-serif';
    ctx.fillText('スマホ: 押しながら動かして、はなして落とす', W / 2, 370);
    ctx.fillText('PC: マウスで動かして クリックで落とす', W / 2, 394);

    ctx.restore();
  }
}

function drawStar(x, y, r1, r2, n) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (Math.PI * i / n) - Math.PI / 2;
    const r = i % 2 === 0 ? r2 : r1;
    if (i === 0) ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    else ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
  }
  ctx.closePath();
}

// ── Game loop ─────────────────────────────────────────────
const runner = Runner.create();
Runner.run(runner, engine);

function togglePause() {
  if (over || !started) return;
  paused = !paused;
  if (paused) {
    Runner.stop(runner);
    snd.pause();
    touching = false;
  } else {
    Runner.run(runner, engine);
    snd.resume();
  }
}

let lastT = performance.now();
function loop(now) {
  const dt = now - lastT; lastT = now;

  if (!over && !showEvolution && started && !paused) checkOver(dt);
  if (!paused) {
    for (const b of [...world.bodies]) {
      if (b.label === 'animal' && b.position.y > H + 150) World.remove(world, b);
    }
  }

  // Update particles
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.93;
    p.life -= 0.028;
  }
  parts = parts.filter(p => p.life > 0);

  // Update score floaters
  for (const f of flashList) { f.y -= 1.2; f.life -= 0.035; }
  flashList = flashList.filter(f => f.life > 0);

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Responsive sizing ─────────────────────────────────────
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.97;
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', resize);
resize();
</script>
