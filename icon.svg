<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0728"/>
      <stop offset="1" stop-color="#1e0b4a"/>
    </linearGradient>
    <radialGradient id="ball1" cx="40%" cy="35%">
      <stop offset="0" stop-color="#FFE040"/>
      <stop offset="100%" stop-color="#FF8000"/>
    </radialGradient>
    <radialGradient id="ball2" cx="40%" cy="35%">
      <stop offset="0" stop-color="#FF80C0"/>
      <stop offset="100%" stop-color="#C020A0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- 合体エフェクト（光の輪） -->
  <circle cx="256" cy="310" r="130" fill="rgba(255,200,50,0.12)"/>
  <circle cx="256" cy="310" r="155" fill="rgba(255,200,50,0.06)"/>
  <!-- 左の球 -->
  <circle cx="156" cy="295" r="105" fill="url(#ball1)"/>
  <text x="156" y="300" font-size="115" text-anchor="middle" dominant-baseline="middle"
    font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🐱</text>
  <!-- 右の球 -->
  <circle cx="356" cy="295" r="105" fill="url(#ball2)"/>
  <text x="356" y="300" font-size="115" text-anchor="middle" dominant-baseline="middle"
    font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">🐱</text>
  <!-- 合体の輝き -->
  <text x="256" y="125" font-size="110" text-anchor="middle" dominant-baseline="middle"
    font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif">✨</text>
</svg>
